image:
  repository: ghcr.io/tlarbi/tol-ingestion
  tag: develop-867cd8d

replicaCount: 1

service:
  type: ClusterIP
  port: 8003

serviceAccount:
  name: tol-ingestion

resources:
  requests:
    memory: "1Gi"
    cpu: "250m"
  limits:
    memory: "3Gi"
    # Bumped from 500m → 1500m. Le 500m étranglait l'orchestrator
    # pendant l'indexation (palier 75% qui stagne). Transitionnel —
    # sera redescendu à 500m une fois le worker séparé (livraison 2).
    cpu: "1500m"

imagePullSecrets:
  - name: ghcr-secret

# ── External Secrets (HashiCorp Vault) ───────────────────────────
# The target Secret name is derived from the tol-ingestion.secretName
# helper in the chart — we no longer override it here. The previous
# `targetName:` key was a no-op because the chart reads target.name
# (not targetName), and the helper now wins regardless. Keeping this
# values block aligned with the chart schema means the only thing
# that matters per env is `enabled` and the `data` list.
externalSecret:
  enabled: true
  secretStoreName: vault-backend
  secretStoreKind: ClusterSecretStore
  refreshInterval: 5m
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: taxonline/staging/ingestion
        property: SECRET_KEY
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: taxonline/staging/ingestion
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: taxonline/staging/ingestion
        property: S3_SECRET_KEY
    - secretKey: OPENSEARCH_PASS
      remoteRef:
        key: taxonline/staging/ingestion
        property: OPENSEARCH_PASS
    - secretKey: QDRANT_HOST
      remoteRef:
        key: taxonline/staging/ingestion
        property: QDRANT_HOST
    - secretKey: OPENSEARCH_HOST
      remoteRef:
        key: taxonline/staging/ingestion
        property: OPENSEARCH_HOST
    - secretKey: REDIS_URL
      remoteRef:
        key: taxonline/staging/ingestion
        property: REDIS_URL
    - secretKey: DATABASE_URL
      remoteRef:
        key: taxonline/staging/ingestion
        property: DATABASE_URL
    - secretKey: S3_BUCKET
      remoteRef:
        key: taxonline/staging/ingestion
        property: S3_BUCKET
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: taxonline/staging/ingestion
        property: S3_ENDPOINT

    # ── Google Document AI credentials (Sprint 9 OCR) ─────────────
    - secretKey: DOCUMENT_AI_CREDENTIALS_JSON
      remoteRef:
        key: taxonline/staging/document-ai
        property: credentials_json
    - secretKey: DOCUMENT_AI_PROJECT_ID
      remoteRef:
        key: taxonline/staging/document-ai
        property: project_id
    - secretKey: DOCUMENT_AI_PROJECT_NUMBER
      remoteRef:
        key: taxonline/staging/document-ai
        property: project_number
    - secretKey: DOCUMENT_AI_PROCESSOR_ID
      remoteRef:
        key: taxonline/staging/document-ai
        property: processor_id
    - secretKey: DOCUMENT_AI_LOCATION
      remoteRef:
        key: taxonline/staging/document-ai
        property: location

    # ── Anthropic Claude (enrichissement v4 via Haiku) ───────────
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: taxonline/staging/agent
        property: ANTHROPIC_API_KEY

secret:
  enabled: false

ingress:
  # BFF pattern — tol-agent proxifie, pas d'ingress direct
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/auth-url: "http://tol-auth-staging.tol-staging.svc.cluster.local:8002/auth/verify"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-User-ID,X-User-Role,X-User-Plan"
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header Authorization $http_authorization;
  hosts:
    - host: rag.taxonlineai.com
      paths:
        - path: /api/v2/ingestion
          pathType: Prefix
  tls:
    - secretName: rag-tls
      hosts:
        - rag.taxonlineai.com

pdb:
  enabled: false

config:
  TOL_EMBED_URL: "http://tol-embed-staging.tol-staging.svc.cluster.local:8000"
  OPENSEARCH_HOST: "opensearch-staging.storage.svc.cluster.local"
  OPENSEARCH_SSL: "false"
  QDRANT_HOST: "qdrant-staging.storage.svc.cluster.local"
  # Index unique de la recherche juridique. Doit rester aligné sur :
  #   - tol-agent/app/core/search_index.py (SEARCH_INDEX, création au boot)
  #   - tol-agent /search/legal, /autocomplete, /keywords, /related (en dur)
  #   - tol-ingestion/app/services/search_indexer.py (SEARCH_INDEX)
  #   - tol-enrich-worker (OS_INDEX, patch d'enrichissement)
  # L'ancienne valeur "tol-corpus" faisait écrire l'ingestion dans un index
  # que personne ne lisait : un chunk n'apparaissait en recherche qu'après
  # passage du worker d'enrichissement.
  OPENSEARCH_INDEX: "taxonline_search"
  QDRANT_COLLECTION: "tol-corpus"

  # ── Embedding throughput tuning (Livraison 1) ─────────────────
  # EMBED_BATCH_SIZE=64    : up from 10 (tol-embed accepte 256/req).
  # EMBED_CONCURRENCY=4    : 4 batches en parallèle round-robined sur
  #   les 3 replicas tol-embed. Initialement à 8 mais on a observé
  #   des OOMKill sur tol-embed (peak RAM ~3.5-4 GB par pod sous
  #   charge). 4 // 3 replicas = 1.33 batch en flight par pod en
  #   moyenne, marge confortable sous le nouveau limits.memory=5Gi.
  EMBED_BATCH_SIZE: "64"
  EMBED_CONCURRENCY: "4"

  # ── OCR (Sprint 9) ────────────────────────────────────────────
  OCR_PROVIDER: "google_document_ai"
  OCR_MIN_CONFIDENCE: "0.80"
  GOOGLE_APPLICATION_CREDENTIALS: "/var/secrets/google/credentials.json"

# ── Google Document AI mount (Sprint 9) ──────────────────────────
documentAi:
  enabled: true
  mountPath: /var/secrets/google

backup:
  triggerFromIngestion: true
