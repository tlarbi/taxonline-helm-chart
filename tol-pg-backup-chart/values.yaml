image:
  repository: ghcr.io/tlarbi/tol-pg-backup
  tag: develop-latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

schedule: "0 2 * * *"
retentionDays: 7

# Bases sauvegardees par le CronJob (liste separee par des virgules).
# Avant 2026-08 seule tol_ingestion l'etait : tol_auth (utilisateurs,
# licences, facturation) et tol_agent (sessions de chat, checkpoints
# LangGraph, feedbacks) n'avaient aucune sauvegarde.
databases: "tol_agent,tol_auth,tol_ingestion"

s3:
  bucket: taxonline-datalake
  prefix: backups/postgres
  endpoint: https://s3.gra.io.cloud.ovh.net
  region: gra

# Test de restauration déclenchable depuis Système › Sauvegardes
# (bases jetables <db>_restore_test, production jamais touchée).
restoreTest:
  enabled: false
  suspend: true            # ne tourne qu'à la demande
  schedule: "0 4 * * 0"    # utilisé seulement si suspend: false
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

vault:
  path:     taxonline/staging/backup
  storeRef: vault-backend

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"
    cpu: "500m"
